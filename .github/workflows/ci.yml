name: ci
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  # Git hooks never run inside CI; CI runs the same four gate names directly.
  LEFTHOOK: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 提交钩子可以被绕过，这里对 PR 里的每个提交再查一遍 AI co-author 署名。
      - name: No AI co-author trailers
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -iE '^[[:space:]]*co-authored-by:.*(claude|codex|anthropic|openai|copilot|cursor|gemini)'; then
            echo "AI co-author trailer found in this pull request"; exit 1
          fi
      # 密钥扫描（00 spec「CI 与部署 · 密钥扫描」）：gitleaks 钉版本并校验 sha256。PR 扫 base..HEAD，
      # push 扫本次推送的提交（新分支或 before 不可达时扫到根）。--redact：命中的内容不进公开的 CI 日志。
      # 它要看提交区间，所以不接进四个门禁名；本地最常见的 .env 误提交由 lint 里的路径黑名单兜住。
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          if [ "$EVENT" = pull_request ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$range" .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 与 Dockerfile 保持同一套依赖解析（含 pnpm 大版本）：CI 用 npm install 会拉到和
      # 生产不同的版本，「CI 绿了」并不能证明生产镜像构建得出来。
      # 版本钉在 package.json 的 packageManager（精确到补丁号，与 Dockerfile、本地开发同一份）：
      # corepack install 按它装。不钉时 corepack 取最新版，大版本漂移会让 onlyBuiltDependencies
      # 的读取位置对不上，esbuild 构建脚本被忽略直接 exit 1。
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      # 四个门禁名是唯一接口：CI、lefthook、Claude Code 的 Stop hook 都只调这四个名字，
      # 背后接什么工具只在 package.json 里改。
      - run: pnpm format:check
      # lint 里的公开边界检查：内容黑名单的词表从仓库 secret 注入（词表本身不能进仓库），
      # 命中只报「文件:行号」。来自 fork 的 PR 拿不到 secret，这一项会跳过。
      - run: pnpm lint
        env:
          SENSITIVE_PATTERNS: ${{ secrets.SENSITIVE_PATTERNS }}
      - run: pnpm typecheck
      # pnpm test 依次跑（任何一步失败即失败）：
      # - src/engine.selftest.ts：阶段/画像、出口护栏、发给模型的请求形状
      # - src/adapters/wecom.selftest.ts：企微发送链路——分段不劈开 URL/emoji、多链接不硬做卡片、
      #   剥离链接不吞正文。这几条只有对着微信实机才看得见，没有断言就会悄悄坏掉。
      # - src/dejargon.selftest.ts：中文话术夹带英文的出口护栏，重点验证不误伤产品库里的酒店品牌名
      # - src/price-guard.selftest.ts：价格出口护栏，两侧都要钉——编价拦得住，
      #   真实报价与「人均 X 万」档位话术零误杀
      # - src/llm.selftest.ts：LLM 调用层（假 fetch，不发真实请求）：思考参数按模型选、1210 自愈、
      #   最后一轮不带 tools、对冲、闸门不为已取消的请求排队、按模型计价。这些错了不报错，只会 400 或多花钱。
      # - src/server.selftest.ts：管理面读接口的可见性——未登录只见种子 + 本人的网页会话，伪造凭据无效，
      #   SSE/usage 不带 id 与原文。泄露别人的对话不会报错、页面照常，没有断言只能靠人去 devtools 里看。
      # - LLM_MOCK=1 eval/run.ts：回归评测（mock 模式，秒级），改 SOP/提示词/护栏后自动回归，防止话术悄悄退化。
      #   真实模型评测要花钱，不进 CI。
      - run: pnpm test
