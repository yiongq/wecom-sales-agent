name: ci
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  # Git hooks never run inside CI; CI runs the same four gate names directly.
  LEFTHOOK: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    # src/db/db.selftest.ts 的真实 PG 部分靠它（经 PG_TEST_URL）；CI=true 而没有 PG_TEST_URL 时那部分直接失败
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 提交钩子可以被绕过，这里对 PR 里的每个提交再查一遍 AI co-author 署名。
      - name: No AI co-author trailers
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" | grep -iE '^[[:space:]]*co-authored-by:.*(claude|codex|anthropic|openai|copilot|cursor|gemini)'; then
            echo "AI co-author trailer found in this pull request"; exit 1
          fi
      # 密钥扫描（00 spec「CI 与部署 · 密钥扫描」）：gitleaks 钉版本并校验 sha256。PR 扫 base..HEAD，
      # push 扫本次推送的提交（新分支或 before 不可达时扫到根）。--redact：命中的内容不进公开的 CI 日志。
      # 它要看提交区间，所以不接进四个门禁名；本地最常见的 .env 误提交由 lint 里的路径黑名单兜住。
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          # gitleaks 8.30.1 在 git log 报错（区间不存在）时照样以 0 退出、报「0 commits scanned」，所以区间两端先验过
          if [ "$EVENT" = pull_request ]; then
            git rev-parse --verify -q "origin/${BASE_REF}^{commit}" >/dev/null || { echo "gitleaks: origin/${BASE_REF} 不存在"; exit 1; }
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}"
          fi
          # -m：只在合并提交里出现的改动（例如解冲突时加进来的）也要扫；-v 列出位置，内容仍由 --redact 遮住
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -v --log-opts="-m $range" .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 与 Dockerfile 保持同一套依赖解析（含 pnpm 大版本）：CI 用 npm install 会拉到和
      # 生产不同的版本，「CI 绿了」并不能证明生产镜像构建得出来。
      # 版本钉在 package.json 的 packageManager（精确到补丁号，与 Dockerfile、本地开发同一份）：
      # corepack install 按它装。不钉时 corepack 取最新版，大版本漂移会让 onlyBuiltDependencies
      # 的读取位置对不上，esbuild 构建脚本被忽略直接 exit 1。
      - run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      # 四个门禁名是唯一接口：CI、lefthook、Claude Code 的 Stop hook 都只调这四个名字，
      # 背后接什么工具只在 package.json 里改。
      - run: pnpm format:check
      # lint 里的公开边界检查：内容黑名单的词表从仓库 secret 注入（词表本身不能进仓库），
      # 命中只报「文件:行号」。来自 fork 的 PR 拿不到 secret，这一项会跳过。
      - run: pnpm lint
        env:
          SENSITIVE_PATTERNS: ${{ secrets.SENSITIVE_PATTERNS }}
      - run: pnpm typecheck
      # pnpm test 依次跑（任何一步失败即失败）：
      # - src/engine.selftest.ts：阶段/画像、出口护栏、发给模型的请求形状
      # - src/adapters/wecom.selftest.ts：企微发送链路——分段不劈开 URL/emoji、多链接不硬做卡片、
      #   剥离链接不吞正文。这几条只有对着微信实机才看得见，没有断言就会悄悄坏掉。
      # - src/dejargon.selftest.ts：中文话术夹带英文的出口护栏，重点验证不误伤产品库里的酒店品牌名
      # - src/price-guard.selftest.ts：价格出口护栏，两侧都要钉——编价拦得住，
      #   真实报价与「人均 X 万」档位话术零误杀
      # - src/llm.selftest.ts：LLM 调用层（假 fetch，不发真实请求）：思考参数按模型选、1210 自愈、
      #   最后一轮不带 tools、对冲、闸门不为已取消的请求排队、按模型计价。这些错了不报错，只会 400 或多花钱。
      # - src/server.selftest.ts：管理面读接口的可见性——未登录只见种子 + 本人的网页会话，伪造凭据无效，
      #   SSE/usage 不带 id 与原文。泄露别人的对话不会报错、页面照常，没有断言只能靠人去 devtools 里看。
      # - src/db/db.selftest.ts：数据库。PGlite 上验迁移、约束与触发器；上面的 postgres 服务上验各角色的权限逐格、
      #   RLS、会话级泄漏与租户锁。RLS 漏了一张表同样不报错，只是别的租户的数据悄悄可见。
      # - src/config/config.selftest.ts：配置源。两种模式逐字节等价、SOP 与产品库的编辑流程、启动重渲染、检索。
      # - src/console-api/console.selftest.ts：鉴权与后台接口（走 app.request）。权限、CSRF、匿名投影漏一处都不报错。
      # - src/packs/packs.selftest.ts：行业包。每个注册的包和假包都过 checkPack；旅游包的工具名、节表、锁定表、阶段与代码一致；
      #   上架前检查 checkItem 在 data/ 的全部条目和几千例变异上与产品库 schema 同判。走偏了不报错，只会让后台说能上架、
      #   保存却 422，或者锁定、阶段、工具名和引擎对不上。
      # - src/shared/typography.selftest.ts、console/src/typography.selftest.ts：连用全角标点的挤压回退（与 Chromium 逐对量出的
      #   结果对拍）、cjk() 与 Sep 的标记、全局 text-spacing-trim 的约定。回退错了只在 Firefox、Safari 里标点宽度不对，不报错。
      # - src/shared/format.selftest.ts、src/shared/audit-text.selftest.ts：金额、时间、月份区间的写法（时区钉成上海）；审计记录
      #   写成的人话句子（实体名、字段名取自行业包，表外的动作兜底）与连续同类记录的合并。写错了不报错，只是页面上的字不对。
      # - console/src/session.selftest.ts、console/src/parts/errors.selftest.ts：会话过期后就地重登（请求停住、登录后重放，
      #   匿名形状的数据不进缓存）；错误文案与 spec 的表逐条相同，服务端的 detail 只在折叠的技术详情里。判错了不报错，
      #   只会让页面跳成匿名、编辑的内容丢掉，或者把服务端原文摆给运营看。
      # - console/src/shell/shell.selftest.ts：外壳。启动时 /me、/pack 各种组合定下的身份（成员身份下 /me 失败不降成匿名）、
      #   由行业包生成的侧栏与权限、每个路由恰一个选中项、标签页标题、⌘K 的拼音匹配与键盘。错了页面照常，只是入口多了或少了。
      # - console/src/fields/fields.selftest.tsx：字段渲染器。11 种字段类型各三种形态；旅游包与假包的每个字段都画一遍；
      #   打开 data/ 下每条线路、酒店不做改动，补丁为空，每个字段经控件读出再写回不变（餐食的「早/午/晚」逐字节往返）；
      #   锁定、只读与 4 列的规则。错了不报错，只会让没改过的条目也发出 PATCH、改写现有数据，或者把锁定的字段画成输入框。
      # - console/src/sop/sop.selftest.tsx：销售话术页的目录、额度条与状态句。字数与服务端同一口径（含还没保存的改动）、
      #   95% 与上限两道线、节表与锁定原因取 /sop 与行业包、URL 的 section 与方向键。错了不报错，只是额度条和目录说得不对。
      #   另钉住逐字重渲不碰弹层（目录的行、窄屏下拉、关着的危险确认），不然快速连按时 React 报 #185；
      #   整页挂在真的路由上核对接线：换节不进浏览历史的方向键、只拦离开这一页的未保存保护、按存下来的规范形实时算字数。
      # - scripts/check-console-src.selftest.ts：lint 里 check-console-src.ts 的夹具，每条不变量造几处违规，确认都点得出位置。
      # - LLM_MOCK=1 eval/run.ts：回归评测（mock 模式，秒级），改 SOP/提示词/护栏后自动回归，防止话术悄悄退化。
      #   文件模式、DB 模式（PGlite）各跑一遍。真实模型评测要花钱，不进 CI。
      # - scripts/check-fonts.ts：界面用到的每个汉字和全部 CJK 标点都在已提交的 UI 优先片字体里，字体与许可原文的 sha256 对得上。
      #   缺字不报错，只会让页面去下长尾分片、标点跨文件不挤压。
      # - console 生产构建，再扫描产物：浏览器包里混进数据库驱动或 Node 内置模块不会报错，只会把服务端代码发给浏览器；
      #   样张页（VITE_SPECIMEN=1 才有）也不能混进生产产物；⌘K 的拼音库只能在懒加载的分块里，不进入口。
      #   假包（家装整装，只给自测与走查）的模块和文字都不能进生产产物，文字按 JS 里的字符串逐个整串比对。
      - run: pnpm test
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
