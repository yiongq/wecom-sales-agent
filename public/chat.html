<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>云途定制旅行顾问</title>
<style>
  /* 仿企业微信会话。手机宽度居中，桌面端衬一圈深色底模拟手机外框。 */
  :root {
    --wx-bg: #ededed;
    --wx-green: #95ec69;
    --wx-btn: #07c160;
    --wx-text: #191919;
    --wx-sub: #999;
    --hairline: rgba(0, 0, 0, .08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 内联线性图标：继承文字大小与颜色 */
  .ic { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; }
  html, body { height: 100%; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--wx-text);
    background: #23252b;
    display: flex;
    justify-content: center;
  }

  /* 桌面手机外框：手机端 display:contents 让它对布局透明，仅宽屏才显形。 */
  .device { display: contents; }

  .phone {
    width: 100%;
    max-width: 420px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--wx-bg);
    box-shadow: 0 0 60px rgba(0, 0, 0, .5);
  }

  /* iOS 伪状态栏：仅桌面外框内显示 */
  .statusbar {
    display: none;
    flex: none;
    position: relative;
    align-items: center;
    justify-content: space-between;
    height: 44px;
    padding: 0 26px 0 30px;
    background: #f7f7f7;
    font-size: 14px;
    font-weight: 600;
    color: #050505;
    letter-spacing: .3px;
  }
  .statusbar .sb-time { font-variant-numeric: tabular-nums; }
  .statusbar .sb-right { display: flex; align-items: center; gap: 6px; }
  .statusbar .sb-right svg { display: block; }
  .sb-island {
    position: absolute; left: 50%; top: 9px; transform: translateX(-50%);
    width: 84px; height: 25px; border-radius: 14px; background: #000;
  }

  /* 顶栏 */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: #f7f7f7;
    border-bottom: .5px solid var(--hairline);
  }
  .topbar .back { font-size: 20px; color: #333; width: 28px; }
  .topbar .title { flex: 1; text-align: center; }
  .topbar .title h1 { font-size: 17px; font-weight: 600; }
  .topbar .title .status {
    font-size: 11px; color: var(--wx-sub);
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .topbar .title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--wx-btn);
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .35; } }
  .topbar .new-btn {
    font-size: 13px; color: #576b95; background: none; border: none;
    cursor: pointer; padding: 4px 0 4px 8px; font-family: inherit;
  }

  /* 消息区 */
  .msgs {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 4px;
    scroll-behavior: smooth;
  }
  .time-chip {
    text-align: center;
    font-size: 12px;
    color: #b2b2b2;
    margin: 10px 0;
  }
  .row { display: flex; margin-bottom: 14px; align-items: flex-start; gap: 8px; }
  .row.me { flex-direction: row-reverse; }
  .avatar {
    flex: none;
    width: 38px; height: 38px;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: #fff;
    user-select: none;
  }
  .row.ai .avatar { background: linear-gradient(135deg, #2b2d36, #5a4a2f); font-family: Georgia, "Songti SC", serif; }
  .row.me .avatar { background: linear-gradient(135deg, #6b7a99, #4a5568); }
  .bubble-wrap { max-width: 74%; display: flex; flex-direction: column; }
  .row.me .bubble-wrap { align-items: flex-end; }
  .nick { font-size: 11px; color: var(--wx-sub); margin: 0 0 3px 4px; }
  .bubble {
    position: relative;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 15.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: normal;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  .row.ai .bubble { background: #fff; }
  .row.me .bubble { background: var(--wx-green); }
  /* 小尾巴 */
  .bubble::before {
    content: ""; position: absolute; top: 13px;
    border: 6px solid transparent;
  }
  .row.ai .bubble::before { left: -11px; border-right-color: #fff; }
  .row.me .bubble::before { right: -11px; border-left-color: var(--wx-green); }
  .bubble a.paylink {
    color: #576b95; font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid rgba(87, 107, 149, .4);
  }
  .row.me .bubble a.paylink { color: #0a6e3a; border-bottom-color: rgba(10, 110, 58, .4); }
  .bubble strong { font-weight: 600; }
  /* 打字机光标 */
  .caret {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--wx-btn);
    margin-left: 1px;
    vertical-align: -2px;
    animation: caretblink .8s steps(1) infinite;
  }
  @keyframes caretblink { 50% { opacity: 0; } }

  /* 微信支付风格卡片（成交消息）：跟在正文气泡下面，同企微通道「正文 + 链接卡片」两条发 */
  .pay-card {
    width: 250px;
    max-width: 100%;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .09);
    animation: pop .2s ease-out;
  }
  .pay-card[hidden] { display: none; }
  .bubble + .pay-card { margin-top: 8px; }
  .pc-head {
    display: flex; align-items: center; gap: 7px;
    padding: 11px 14px;
    font-size: 13px; color: #7a7a7a;
    border-bottom: .5px solid var(--hairline);
  }
  .pc-logo {
    flex: none;
    width: 20px; height: 20px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
    background: linear-gradient(135deg, #2b2d36, #5a4a2f);
    font-family: Georgia, "Songti SC", serif;
  }
  .pc-body { padding: 16px 16px 18px; text-align: center; }
  .pc-title { font-size: 14px; color: #333; margin-bottom: 10px; word-break: break-word; }
  .pc-trip { font-size: 12px; color: #6b6b6b; margin: -4px 0 10px; }
  .pc-trip[hidden], .pc-amount[hidden] { display: none; }
  .pc-amount { font-size: 30px; font-weight: 600; color: #191919; line-height: 1; }
  .pc-cur { font-size: 17px; font-weight: 600; margin-right: 3px; }
  .pc-meta { font-size: 11px; color: #b0b0b0; margin-top: 9px; }
  .pc-btn {
    display: block; text-align: center;
    background: var(--wx-btn); color: #fff;
    font-size: 15px; font-weight: 500;
    padding: 12px; text-decoration: none;
    margin: 0 14px 14px;
    border-radius: 6px;
    transition: opacity .15s;
  }
  .pc-btn:active { opacity: .85; }
  .pc-btn.done { background: #f2f2f2; color: #576b95; }

  /* 打字中 */
  .typing .bubble { display: inline-flex; gap: 5px; align-items: center; padding: 14px 14px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #c5c5c5;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; transform: translateY(-2px); } }

  /* 开场快捷气泡 */
  .chips {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 2px 12px 10px;
    background: var(--wx-bg);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips[hidden] { display: none; }
  .chip {
    flex: none;
    border: .5px solid rgba(7, 193, 96, .35);
    background: #fff;
    color: #07743f;
    font: inherit;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 16px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
    transition: transform .12s, background .12s;
  }
  .chip:active { transform: scale(.96); background: #f2fbf5; }

  /* 输入栏 */
  .inputbar {
    flex: none;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: #f7f7f7;
    border-top: .5px solid var(--hairline);
  }
  .inputbar textarea {
    flex: 1;
    resize: none;
    border: none;
    border-radius: 6px;
    background: #fff;
    padding: 9px 12px;
    font: inherit;
    font-size: 15.5px;
    max-height: 96px;
    outline: none;
  }
  .inputbar button {
    flex: none;
    border: none;
    border-radius: 6px;
    background: var(--wx-btn);
    color: #fff;
    font: inherit;
    font-size: 15px;
    padding: 9px 18px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .inputbar button:disabled { opacity: .45; cursor: default; }

  /* 页脚说明 */
  .foot {
    flex: none;
    text-align: center;
    font-size: 11px;
    color: #a8a8a8;
    line-height: 1.6;
    padding: 6px 16px calc(8px + env(safe-area-inset-bottom));
    background: var(--wx-bg);
  }

  /* ==== 桌面手机外框：仅宽屏生效，手机端完全不变 ==== */
  @media (min-width: 640px) {
    body {
      align-items: center;
      padding: 32px 16px;
      background: radial-gradient(120% 90% at 50% 0%, #2c2e36 0%, #1b1c22 58%, #131318 100%);
    }
    .device {
      display: block;
      position: relative;
      padding: 13px;
      border-radius: 58px;
      background: linear-gradient(150deg, #3b3c44 0%, #17181d 42%, #101015 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .08),
        0 0 0 2px #0b0b0e,
        0 40px 80px -22px rgba(0, 0, 0, .78),
        0 0 90px -28px rgba(224, 178, 94, .40); /* 极淡暖金辉光 */
    }
    /* 侧键：左音量、右电源 */
    .device::before, .device::after {
      content: ""; position: absolute;
      width: 3px;
      background: linear-gradient(#282a30, #14151a);
    }
    .device::before { left: -3px; top: 150px; height: 62px; border-radius: 3px 0 0 3px; }
    .device::after  { right: -3px; top: 172px; height: 48px; border-radius: 0 3px 3px 0; }

    .phone {
      max-width: 392px;
      height: min(844px, calc(100dvh - 100px));
      border-radius: 46px;
      overflow: hidden;
      box-shadow: none;
    }
    .statusbar { display: flex; }
  }
</style>
</head>
<body>
<!-- 内联 SVG 图标精灵（Lucide 风格），供 <use href="#ic-xxx"> 引用 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="ic-waves" viewBox="0 0 24 24"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></symbol>

  <symbol id="ic-headset" viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H4a1 1 0 0 1-1-1v-6a9 9 0 0 1 18 0v6a1 1 0 0 1-1 1h-2a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></symbol>

<div class="device">
<div class="phone">
  <div class="statusbar">
    <span class="sb-time" id="sbTime">9:41</span>
    <span class="sb-island"></span>
    <span class="sb-right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#050505" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#050505" aria-hidden="true"><path d="M8 2.4c2.4 0 4.6.9 6.2 2.4.3.3.3.7 0 1l-.3.3c-.3.3-.7.3-1 0C11.7 4.9 9.9 4.2 8 4.2S4.3 4.9 3.1 6.1c-.3.3-.7.3-1 0l-.3-.3c-.3-.3-.3-.7 0-1C3.4 3.3 5.6 2.4 8 2.4Z" opacity=".9"/><path d="M8 6c1.4 0 2.7.5 3.7 1.4.3.3.3.7 0 1l-.4.4c-.3.3-.6.3-.9 0-.6-.5-1.5-.9-2.4-.9s-1.8.4-2.4.9c-.3.3-.6.3-.9 0l-.4-.4c-.3-.3-.3-.7 0-1C5.3 6.5 6.6 6 8 6Z"/><circle cx="8" cy="10.4" r="1.4"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x="1" y="1" width="22" height="11" rx="3" fill="none" stroke="#050505" stroke-opacity=".4"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#050505"/><rect x="24.5" y="4.5" width="1.6" height="4" rx=".8" fill="#050505" fill-opacity=".4"/></svg>
    </span>
  </div>

  <div class="topbar">
    <span class="back">‹</span>
    <div class="title">
      <h1>云途定制旅行顾问</h1>
      <div class="status"><span class="dot"></span>AI 顾问在线</div>
    </div>
    <button class="new-btn" id="newBtn">新会话</button>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="chips" id="chips" hidden>
    <button class="chip" data-q="想去西藏，两个人"><svg class="ic"><use href="#ic-waves"/></svg> 西藏两人游</button>
    <button class="chip" data-q="这个太贵了，能便宜点吗"><svg class="ic"><use href="#ic-percent"/></svg> 太贵了能便宜点吗</button>

    <textarea id="input" rows="1" placeholder="想去哪儿玩？聊聊您的旅行计划…" enterkeyhint="send"></textarea>

    Demo：模拟企业微信会话。生产环境经企微回调接入，界面即企业微信本身。<br>演示环境·模拟支付

<script>
(() => {
  const LS_KEY = 'ssj_session_id';
  const msgsEl = document.getElementById('msgs');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const chipsEl = document.getElementById('chips');
  // 会话 ID 就是凭据：凭它直读对话全文，后台列表也只凭它把「你自己的会话」放给同一浏览器的 admin.html。
  // 必须是密码学随机、给足熵（与服务端生成的一致：12 字节 = 24 位十六进制）。此前用 Math.random 取
  // 8 位 36 进制，约 41 bit 且可预测；服务端的后台列表不认这种旧 id，restore() 会在合适的时机换掉它。
  const STRONG_ID_RE = /^sim-[0-9a-f]{24,64}$/; // 与服务端 OWN_SIM_RE 一致
  function newSessionId() {
    const b = crypto.getRandomValues(new Uint8Array(12));
    return 'sim-' + Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  }
  let sessionId = localStorage.getItem(LS_KEY);
  if (!sessionId) {
    sessionId = newSessionId();
    localStorage.setItem(LS_KEY, sessionId);
  }
  let lastTs = 0;
  let typingEl = null;

  const esc = (s) => s.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);

  // 转义 → **加粗** → 站内链接（支付 / 方案书）可点 → 换行渲染
  // 行首拿 emoji 当项目符号 → 干净的「·」（句中 emoji 保留），与微信通道观感一致
  function tidyBullets(text) {
    return text.replace(/^\s*(?:[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}]️?)\s+/gmu, '· ');
  }

  function renderContent(text) {
    let html = esc(tidyBullets(text));
    html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(?:https?:\/\/[^\s]+)?(\/pay\/[A-Za-z0-9_-]+)/g,
      '<a class="paylink" href="$1" target="_blank">点击支付 → $1</a>');
    // 方案书链接（generate_proposal 产出 /proposal/<线路>/<人数>[/日期]）。此前只认 /pay/，
    // 引导页宣传的「出个详细行程方案」在模拟器里是一串点不动的纯文本
    html = html.replace(/(?:https?:\/\/[^\s]+)?(\/proposal\/[A-Za-z0-9_-]+(?:\/[\d-]+)*)/g,
      '<a class="paylink" href="$1" target="_blank">查看行程方案 → $1</a>');
    return html.replace(/\n/g, '<br>');
  }

  // 成交消息 → 正文气泡 + 微信支付风格卡片，规则与企微通道（src/adapters/wecom.ts 的
  // extractCard / stripLink）一致：正文里恰好一条站内链接、且是支付链接才出卡片。
  // 卡片上的线路名和金额一律读订单本身（/api/orders/:id），不从正文里抠——此前取正文里
  // 第一个 ¥ 金额，模型按 SOP 先写每人价时，卡片显示的就是每人价，点进支付页却是总价。
  const SITE_LINK_RE = /(?:https?:\/\/[^\s]*)?\/(?:proposal|pay)\/[A-Za-z0-9_-]+(?:\/[\d-]+)*/g;
  function payLinkOf(text) {
    const all = text.match(SITE_LINK_RE) || [];
    if (all.length !== 1) return null;
    const m = all[0].match(/\/pay\/([A-Za-z0-9_-]+)/);
    return m ? { raw: all[0], orderId: m[1], href: '/pay/' + m[1] } : null;
  }

  // 只挖掉 URL 本身，不删整行（链接常和报价、出发日期写在同一行）。规则与企微 stripLink 逐条一致
  // （wecom.selftest 会拿这个函数和企微版对照跑，各条规则的来由见 adapters/wecom.ts）：链接独占一行、
  // 只剩「👉」或只剩「支付链接」这类标签时整行拿掉，上一行也只是标签的一并拿掉；「在这儿」「点这里」「发您」
  // 这类指着链接的说法改成指着下方卡片——卡片排在正文之后，留着就是指向空气。辅助规则写在函数里面，方便自测整段取出。
  function stripLink(body, raw) {
    const LABEL = new RegExp(
      '^(?:\\d{1,2}\\s*[.、．)）]\\s*|[①-⑩]\\s*)?(?:这是|这里是)?(?:您|你)?的?(?:专属)?的?(?:本单|订单)?的?' +
        '(?:(?:支付|付款|订单|下单)(?:链接|入口|页面|地址)?|(?:立即|马上|去|点击)(?:支付|付款)' +
        '|(?:详细|完整)?的?(?:行程)?(?:方案书?|计划书|行程单)(?:链接|地址)?|(?:详细|完整)?的?行程|(?:方案|行程)?链接)$',
    );
    const NUMBERED = /^(?:\d{1,2}\s*[.、．)）]|[①-⑩])/;
    const labelCore = (s) => s.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
    const isLabel = (s) => LABEL.test(labelCore(s));
    const PTR_BEFORE = /(?:\s*(?:👉|👈|👇|➡️?|⬇️?|→|↓))+\s*$/u;
    const PTR_AFTER = /^\s*(?:(?:👉|👈|👇|➡️?|⬇️?|→|↓)\s*)+/u;
    const pointToCard = (s) => {
      if (!s || /下方|卡片/.test(s)) return s;
      if (isLabel(s)) return s + '见下方卡片';
      const tap = s.replace(/(?:点击|点|戳)(?:这里|这儿|此处)/, '点下方卡片');
      if (tap !== s) return tap;
      if (/(?:请|烦请|麻烦|支付|付款)点击?$/.test(s)) return s + '下方卡片';
      const here = s.replace(/(方案书?|计划书?|行程单?|链接|入口|明细|详情)(?:就|都)?(?:在这里|在这儿|在这|如下)(?=$|[，,。！!～~；;])/, '$1见下方卡片');
      if (here !== s) return here;
      if (/(?:发(?:给)?您|给您|(?:做|生成|准备|整理|出)好了?|已生成)(?:看看|过目)?(?:了|啦)?$/.test(s)) return s + '，见下方卡片';
      return s;
    };
    const tidy = (s) => s.replace(/[ \t]{2,}/g, ' ').replace(/^[\s，,：:、]+|[\s，,：:、]+$/g, '');
    const lines = body.split('\n'); // null = 整行拿掉（与原文空行区分开，段落间距照旧）
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (line === null || !line.includes(raw)) continue;
      const at = line.indexOf(raw);
      const beforeRaw = line.slice(0, at).replace(PTR_BEFORE, (m) => (/^\s/.test(m) ? ' ' : ''));
      const afterRaw = line.slice(at + raw.length).replace(PTR_AFTER, (m) => (/\s$/.test(m) ? ' ' : ''));
      const rest = tidy(beforeRaw + afterRaw).replace(/[：:][ \t]*([，,、；;])/, '$1').replace(/[：:][ \t]*(?=[（(])/, '');
      const core = labelCore(rest);
      if (core && !LABEL.test(core)) {
        const before = tidy(beforeRaw);
        const after = tidy(afterRaw);
        const pointed = pointToCard(before);
        if (pointed === before) lines[i] = rest;
        else if (!after) lines[i] = pointed;
        else if (!/[\p{L}\p{N}]/u.test(after)) lines[i] = pointed + ' ' + after;
        else lines[i] = pointed + (/^[。！!？?～~（(]/.test(after) ? '' : '，') + after;
        continue;
      }
      if (core && NUMBERED.test(core)) { lines[i] = rest + '见下方卡片'; continue; }
      lines[i] = null;
      for (let j = i - 1; j >= 0; j--) {
        const prev = lines[j];
        if (prev === null || !prev.trim()) continue;
        const colon = /[：:]\s*$/.test(prev);
        const p = prev.replace(/[：:]?\s*$/, '');
        if ((colon || j === i - 1) && isLabel(p)) lines[j] = NUMBERED.test(labelCore(p)) ? p + '见下方卡片' : null;
        else if (colon) lines[j] = pointToCard(p) + '。';
        else if (j === i - 1) lines[j] = pointToCard(p);
        break;
      }
    }
    return lines.filter((l) => l !== null).map((l) => (l.trim() ? l : ''))
      .join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // 卡片上的出发日期写成正文里的样子（「10月12日」），跨年才带年份——与企微卡片一致
  function cnDate(iso) {
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(iso);
    if (!m) return iso;
    const md = Number(m[2]) + '月' + Number(m[3]) + '日';
    return Number(m[1]) === new Date().getFullYear() ? md : m[1] + '年' + md;
  }

  // 先出卡片骨架（按钮直接可点），订单读到后再填线路名与总价。
  // 读不到（订单不存在、查询限流、断网）就不显示金额——宁可空着，也不显示一个猜的数。
  function payCardHTML(pay) {
    return (
      '<div class="pay-card">' +
        '<div class="pc-head"><span class="pc-logo">云</span>云途定制旅行 · 订单</div>' +
        '<div class="pc-body">' +
          '<div class="pc-title">订单信息加载中…</div>' +
          '<div class="pc-trip" hidden></div>' +
          '<div class="pc-amount"><span class="pc-cur">¥</span><span class="pc-num">--</span></div>' +
          '<div class="pc-meta">演示环境 · 模拟支付</div>' +
        '</div>' +
        '<a class="pc-btn" href="' + esc(pay.href) + '">立即支付</a>' +
      '</div>'
    );
  }

  async function fillPayCard(card, pay) {
    const q = (sel) => card.querySelector(sel);
    try {
      const res = await fetch('/api/orders/' + encodeURIComponent(pay.orderId));
      if (!res.ok) throw new Error('http ' + res.status);
      const o = await res.json();
      if (typeof o.totalPrice !== 'number') throw new Error('bad order');
      q('.pc-title').textContent = o.routeTitle || '定制旅行订单';
      q('.pc-num').textContent = o.totalPrice.toLocaleString('zh-CN');
      const trip = q('.pc-trip');
      trip.textContent = o.travelers + ' 位出行 · ' + (o.departDate ? cnDate(o.departDate) + '出发' : '日期待定') + ' · 合计';
      trip.hidden = false;
      // 翻历史时订单可能早已付过款，别再挂着「立即支付」
      if (o.status === 'paid') { q('.pc-btn').textContent = '已支付 · 查看订单'; q('.pc-btn').classList.add('done'); }
    } catch {
      q('.pc-title').textContent = '定制旅行订单';
      q('.pc-amount').hidden = true;
      q('.pc-btn').textContent = '查看订单';
    }
  }

  // 打字机逐字渐显：约 30ms/字，长消息总时长封顶 ~2.5s，滚动跟随。打完回调 onDone。
  function typewrite(bubble, text, onDone) {
    const len = text.length;
    const interval = 32;
    const total = Math.min(len * 30, 2500);
    const steps = Math.max(1, Math.round(total / interval));
    const per = Math.max(1, Math.ceil(len / steps));
    let i = 0;
    const step = () => {
      i = Math.min(len, i + per);
      const caret = i < len ? '<span class="caret"></span>' : '';
      bubble.innerHTML = renderContent(text.slice(0, i)) + caret;
      scrollBottom();
      if (i >= len) { clearInterval(timer); if (onDone) onDone(); }
    };
    const timer = setInterval(step, interval);
    step();
  }

  function maybeTimeChip(at) {
    if (at - lastTs > 5 * 60 * 1000) {
      const chip = document.createElement('div');
      chip.className = 'time-chip';
      chip.textContent = new Date(at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      msgsEl.appendChild(chip);
    }
    lastTs = at;
  }

  // opts.animate: 是否走打字机（默认：AI 消息动画、客户消息即时）。
  function addMsg(role, text, at = Date.now(), opts = {}) {
    maybeTimeChip(at);
    const me = role === 'customer';
    const animate = opts.animate !== undefined ? opts.animate : !me;
    const row = document.createElement('div');
    row.className = 'row ' + (me ? 'me' : 'ai');
    const avatar = '<div class="avatar">' + (me ? '我' : '云') + '</div>';
    const nick = me ? '' : '<div class="nick">云途定制旅行顾问 · AI</div>';

    // AI 成交消息：正文照常显示（只挖掉那条裸链接），支付卡片追加在正文下面。
    // 此前是整条消息换成卡片，出发日期、「名额以付款为准」、旺季调价说明全被吞掉。
    const pay = me ? null : payLinkOf(text);
    const body = pay ? stripLink(text, pay.raw) : text;

    row.innerHTML = avatar + '<div class="bubble-wrap">' + nick
      + (body ? '<div class="bubble"></div>' : '')
      + (pay ? payCardHTML(pay) : '') + '</div>';
    msgsEl.appendChild(row);
    const card = row.querySelector('.pay-card');
    if (card) fillPayCard(card, pay);
    const bubble = row.querySelector('.bubble');
    if (bubble && animate) {
      // 打字机期间先藏住卡片，否则正文逐字变长会把卡片一路往下推
      if (card) card.hidden = true;
      typewrite(bubble, body, () => { if (card) { card.hidden = false; scrollBottom(); } });
    } else {
      if (bubble) bubble.innerHTML = renderContent(body);
      scrollBottom();
    }
    return row;
  }

  function showTyping() {
    hideTyping();
    typingEl = document.createElement('div');
    typingEl.className = 'row ai typing';
    typingEl.innerHTML = '<div class="avatar">云</div><div class="bubble-wrap"><div class="bubble"><i></i><i></i><i></i></div></div>';
    msgsEl.appendChild(typingEl);
    scrollBottom();
  }
  function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

  function scrollBottom() { msgsEl.scrollTop = msgsEl.scrollHeight; }

  function showChips() { chipsEl.hidden = false; }
  function hideChips() { chipsEl.hidden = true; }

  function welcome() {
    addMsg('agent', '您好，欢迎来到云途定制旅行 ✨\n我是您的专属旅行顾问。想去川西藏地、云南雪山，还是新疆看看？和我聊聊您的想法吧～');
    showChips(); // 空会话时露出开场快捷气泡
  }

  // 恢复历史（服务端重启丢会话则重新开场）
  // 顺带升级旧版短 id：上面只在存储为空时才生成新 id，上线前来过的访客会无限期沿用旧 id，后台永远
  // 认不出他本人。服务端没有这段会话（404：从没聊过，或闲置被清理）时换成满熵新 id，没有历史可丢；
  // 会话还在就先留着，清理后下次来访再换。只认 404：429 限流、5xx、断网都不说明会话不存在，换了会丢历史。
  async function restore() {
    try {
      const res = await fetch('/api/sessions/' + encodeURIComponent(sessionId));
      if (res.status === 404 && !STRONG_ID_RE.test(sessionId)) {
        sessionId = newSessionId();
        localStorage.setItem(LS_KEY, sessionId);
      }
      if (!res.ok) return welcome();
      const s = await res.json();
      const visible = (s.messages || []).filter((m) => m.role !== 'system');
      if (!visible.length) return welcome();
      visible.forEach((m) => addMsg(m.role, m.content, m.at, { animate: false }));
    } catch { welcome(); }
  }

  // SSE：接服务端主动推送（支付跟进 / 人工回复）
  function connectSSE() {
    const es = new EventSource('/api/stream/' + encodeURIComponent(sessionId));
    es.addEventListener('push', (e) => {
      try { addMsg('agent', JSON.parse(e.data).text); } catch {}
    });
    // 断线由 EventSource 自动重连
  }

  // 服务端给了 {error} 就照实显示；没给（纯文本的 413 等）按状态码补一句人话
  function chatErrorText(status, data) {
    if (data && typeof data.error === 'string' && data.error) return data.error;
    if (status === 413) return '消息过长（≤1000 字）';
    if (status === 429) return '发送太频繁了，请稍后再试';
    return '系统开小差了，请稍后再试';
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    // 等 restore() 定下最终的 id 再发：页面一开就点开场气泡时，第一句会抢先落进旧 id，对话被劈成两段。
    // 也让开场白与历史先上屏，不插到这句后面。restore() 自己兜住所有异常，这里不会抛
    await restored;
    hideChips(); // 客户发出第一条即隐藏开场气泡
    const myRow = addMsg('customer', text);
    showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId, text }),
      });
      // body 只能读一次，错误分支也只能用这里的 data。413/411 是中间件回的纯文本，
      // 解析失败记 null——不能让它抛到外层 catch，被误报成「网络异常」。
      const data = await res.json().catch(() => null);
      hideTyping();
      if (!res.ok) {
        // 限流和长度校验的服务端提示更有用，别一律糊成「系统开小差」
        addMsg('agent', '（' + chatErrorText(res.status, data) + '）');
        // 非 2xx 都是服务端在处理前就拒收了（异常兜底走 200），这条消息并没有进会话：
        // 撤掉刚才乐观显示的气泡，把原文放回输入框，改短或稍等后可直接重发
        myRow.remove();
        if (!inputEl.value) { inputEl.value = text; inputEl.dispatchEvent(new Event('input')); }
        return;
      }
      if (!data || !data.reply) { addMsg('agent', '（系统开小差了，请稍后再试）'); return; }
      if (data.sessionId && data.sessionId !== sessionId) {
        sessionId = data.sessionId;
        localStorage.setItem(LS_KEY, sessionId);
      }
      // 转人工后 AI 沉默：无正文则不渲染气泡
      if (data.reply.silent || !data.reply.text) return;
      addMsg('agent', data.reply.text);
    } catch {
      hideTyping();
      addMsg('agent', '（网络异常，请检查服务是否在运行）');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 96) + 'px';
  });
  chipsEl.querySelectorAll('.chip').forEach((btn) => {
    btn.addEventListener('click', () => {
      inputEl.value = btn.dataset.q;
      send();
    });
  });
  document.getElementById('newBtn').addEventListener('click', () => {
    localStorage.removeItem(LS_KEY);
    location.reload();
  });

  // iOS 伪状态栏时钟
  const sbTime = document.getElementById('sbTime');
  function tickClock() {
    if (!sbTime) return;
    const d = new Date();
    sbTime.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tickClock();
  setInterval(tickClock, 15000);

  // SSE 按 restore() 定下的 id 订阅，否则旧 id 被换掉后推送（支付跟进 / 人工回复）还挂在旧 id 上
  const restored = restore();
  restored.then(connectSSE);
  inputEl.focus();
})();
</script>
</body>
</html>
