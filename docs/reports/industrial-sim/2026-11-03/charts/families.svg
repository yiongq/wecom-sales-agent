<text class="t" x="156" y="252" font-size="13" text-anchor="end">多行清单</text><path class="a" d="M168 242h417a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-417z"/><text class="s" x="597" y="252" font-size="12">9/10</text>
<text class="t" x="156" y="284" font-size="13" text-anchor="end">库外与替代</text><path class="a" d="M168 274h464a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-464z"/><text class="s" x="644" y="284" font-size="12">5/5</text>
