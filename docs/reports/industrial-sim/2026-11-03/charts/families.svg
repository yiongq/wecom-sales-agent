<text class="t" x="156" y="380" font-size="13" text-anchor="end">库存交期</text><path class="a" d="M168 370h417a4 4 0 0 1 4 4v4a4 4 0 0 1 -4 4h-417z"/><text class="s" x="597" y="380" font-size="12">9/10</text>
