<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" width="720" role="img" aria-label="按场景族的成功率" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
<style>.bg{fill:#fcfcfb}.t{fill:#0b0b0b}.s{fill:#52514e}.g{stroke:#e8e7e3}.a{fill:#2a78d6}.b{fill:#eb6834}
